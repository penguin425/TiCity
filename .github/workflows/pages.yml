name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  browser_shard:
    name: Chromium shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility smoke tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --max-failures=1

      - name: Upload browser report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  build:
    name: Verify and package
    # Packaging and deployment remain gated on the complete browser suite.
    needs: browser_shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify license and offline boundary
        run: npm run test:license

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          TICITY_GIT_SHA: ${{ github.sha }}

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke deployed pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          pages_base="${PAGE_URL%/}/"
          curl --fail --location --retry 5 --retry-delay 3 "${pages_base}"
          curl --fail --location --retry 5 --retry-delay 3 "${pages_base}machine/"
          curl --fail --location --retry 5 --retry-delay 3 "${pages_base}diagnose/"
