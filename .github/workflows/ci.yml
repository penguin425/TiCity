name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, types, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic model tests
        run: npm test

      - name: Verify license, attribution, and offline boundary
        run: npm run test:license

      - name: Typecheck
        run: npm run typecheck

      - name: Build all static pages
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: ticity-dist
          path: dist
          if-no-files-found: error

  browser_shard:
    name: Chromium shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --max-failures=1

      - name: Upload browser report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  browser:
    # Keep the protected branch's required context stable and fail closed when
    # any shard fails, is cancelled, or is skipped.
    name: Chromium accessibility and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: browser_shard
    if: always()
    steps:
      - name: Require every browser shard to pass
        env:
          SHARD_RESULT: ${{ needs.browser_shard.result }}
        run: test "${SHARD_RESULT}" = success
